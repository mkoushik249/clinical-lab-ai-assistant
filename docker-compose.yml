services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./knowledge-base:/knowledge-base:ro
    depends_on:
      database:
        condition: service_healthy

  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: clinical_lab
      POSTGRES_USER: clinical_app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinical_app -d clinical_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: